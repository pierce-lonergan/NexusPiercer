# Release to Maven Central.
#
# Replaces the stranded `maven-publish.yml`, which sat in the repository root where Actions
# never looks and which had five independent failures stacked in one path:
#
#   1. `mvn -B deploy` ran WITHOUT `-Prelease`, so gpg.skip stayed true and maven-gpg-plugin
#      was never even added to the build — every artifact would have been unsigned.
#   2. `server-id: ossrh` did not match central-publishing-maven-plugin's
#      `publishingServerId=central`, so credentials went to a server the plugin never consults.
#   3. `<distributionManagement>` pointed at s01.oss.sonatype.org, which is decommissioned.
#   4. `gpg.keyname` was referenced by the plugin but never defined anywhere.
#   5. maven-release-plugin never pushed a tag, so the `release: published` trigger — the only
#      automatic trigger — could not fire.
#
# Net effect: 1.0.8 exists on Maven Central with no corresponding tag in this repository and no
# way to trace the artifact back to source. This workflow fixes the path end to end.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign, but do not publish'
        type: boolean
        default: true
      artifacts_only:
        description: 'Publish to the GitHub release WITHOUT Maven Central (requires no secrets)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  MAVEN_ARGS: -B -ntp

jobs:
  # A release must never be cut from a red commit. This re-runs the full suite rather than
  # trusting that CI passed on the same SHA — tags can be moved.
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: ./mvnw ${MAVEN_ARGS} verify

      # The tag is the release's identity; if it disagrees with the POM the published
      # coordinates are wrong and cannot be corrected after the fact — Central is immutable.
      - name: Assert tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          POM_VERSION=$(./mvnw ${MAVEN_ARGS} -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pom=${POM_VERSION} tag=${TAG_VERSION}"
          if [[ "${POM_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${POM_VERSION}"
            exit 1
          fi
          if [[ "${POM_VERSION}" == *SNAPSHOT* ]]; then
            echo "::error::Refusing to release a SNAPSHOT version"
            exit 1
          fi

  publish:
    name: publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          # Must match central-publishing-maven-plugin's <publishingServerId>central</publishingServerId>.
          # The old workflow used `ossrh` here, which the plugin never reads.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Publishing to Central needs three secrets. When they are absent — a fork, or a repository
      # where they were never configured — building installable artifacts for the GitHub release
      # is a legitimate outcome: users get a route that does not depend on Central at all
      # (see docs/INSTALL.md). Central is a convenience, not the only supported path.
      #
      # WHAT THIS STEP USED TO DO, AND WHY IT WAS WRONG. It took that branch silently on ANY
      # trigger, emitted a `::warning::`, and SUCCEEDED. A warning is invisible under a green
      # check. Tag v2.0.0 took this branch in run 31494042124: the GitHub Release was created
      # complete, Central received nothing, and for the next six weeks README.md, docs/INSTALL.md,
      # CHANGELOG.md and SUPPORT.md all told a stranger that `2.0.0` was installable from Central
      # while the only version a resolver could fetch was 1.0.8 — the exact version INSTALL.md
      # tells them not to use. Nobody was notified, because nothing failed.
      #
      # So a TAG PUSH now refuses to degrade. Artifacts-only is still available, but it has to be
      # asked for by name via workflow_dispatch with artifacts_only=true, which makes it a
      # decision someone took rather than a fallback nobody saw. PublishedProjectFactsMatchThe
      # SourceTest gates the other half: the documents must agree with the recorded Central state.
      - name: Detect available publishing credentials
        id: creds
        shell: bash
        env:
          HAS_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN != '' }}
          HAS_GPG: ${{ secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
          # A dry run is included because it publishes nothing at all, so it cannot produce the
          # drift this guard exists to stop - and refusing it would take away the one way to
          # exercise this workflow on a repository that has no secrets yet.
          ARTIFACTS_ONLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && (inputs.artifacts_only || inputs.dry_run) }}
        run: |
          if [[ "${HAS_USER}" == "true" && "${HAS_TOKEN}" == "true" && "${HAS_GPG}" == "true" ]]; then
            echo "mode=central" >> "$GITHUB_OUTPUT"
            echo "Central credentials present; will sign and publish."
            exit 0
          fi

          if [[ "${ARTIFACTS_ONLY_REQUESTED}" != "true" ]]; then
            {
              echo "### Release FAILED: Central credentials absent"
              echo
              echo "| secret | present |"
              echo "|---|---|"
              echo "| MAVEN_CENTRAL_USERNAME | ${HAS_USER} |"
              echo "| MAVEN_CENTRAL_TOKEN | ${HAS_TOKEN} |"
              echo "| MAVEN_GPG_PRIVATE_KEY | ${HAS_GPG} |"
              echo
              echo "A tag push means \"publish this release\". Producing a GitHub-release-only"
              echo "build under that trigger is how \`2.0.0\` came to be documented as available"
              echo "on Central while Central had never received it."
              echo
              echo "Either add the three secrets and re-run, or dispatch this workflow manually"
              echo "with **artifacts_only = true** to say on purpose that this is a"
              echo "GitHub-release-only build."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Central credentials absent on a '${GITHUB_EVENT_NAME}' trigger. Refusing to publish a release that the documentation would describe as on Maven Central. Dispatch with artifacts_only=true to build GitHub-release artifacts deliberately."
            exit 1
          fi

          echo "mode=artifacts-only" >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing to Maven Central: SKIPPED (requested)"
            echo
            echo "\`artifacts_only=true\` was passed explicitly, so this is a GitHub-release-only"
            echo "build by choice rather than by fallback."
            echo
            echo "Building unsigned, installable artifacts for the GitHub release."
            echo "Consumers install via \`docs/INSTALL.md\` route 1, 2 or 3."
            echo
            echo "**If this is a real release, update \`publishing\` in"
            echo "\`.github/quality-baseline.json\`** — the documentation gate reads it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Artifacts-only release requested; Maven Central will NOT receive this version."

      - name: Resolve GPG key id
        id: gpg
        if: steps.creds.outputs.mode == 'central'
        shell: bash
        run: |
          # maven-gpg-plugin's <keyname> reads ${gpg.keyname}, which was never defined. Derive
          # it from the key that setup-java just imported instead of hardcoding a fingerprint.
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [[ -z "${KEY_ID}" ]]; then
            echo "::error::Credentials claimed a GPG key but none was imported; refusing to publish unsigned artifacts to Central"
            exit 1
          fi
          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"

      # Always produced, credentials or not. This is what makes the non-Central install routes
      # real rather than theoretical.
      - name: Build installable artifacts
        run: |
          ./mvnw ${MAVEN_ARGS} package -DskipTests
          ./mvnw ${MAVEN_ARGS} package -Pshade -DskipTests

      # The POM must ship alongside the jar.
      #
      # docs/INSTALL.md route 2 tells users to run
      #   mvn install:install-file -Dfile=...jar -DpomFile=...pom
      # and the first artifact set contained no .pom at all, so that instruction could not be
      # followed. Maven does not place a .pom in target/ for a jar project; it has to be copied
      # under the artifact's name. Without it install:install-file synthesises a POM with no
      # dependencies, and the consumer gets NoClassDefFoundError on first use — a failure that
      # surfaces far from its cause.
      - name: Stage the POM beside the jars
        shell: bash
        run: |
          VERSION=$(./mvnw ${MAVEN_ARGS} -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '[:space:]')
          cp pom.xml "target/nexus-piercer-${VERSION}.pom"
          echo "staged target/nexus-piercer-${VERSION}.pom"

      - name: Checksum every artifact
        shell: bash
        run: |
          shopt -s nullglob
          cd target
          for f in *.jar *.pom; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -1 *.sha256 | sed 's/^/  /'

      - name: Generate SBOM
        run: ./mvnw ${MAVEN_ARGS} -Psecurity cyclonedx:makeAggregateBom -DskipTests -Dcyclonedx.skipNotDeployed=false

      # -Prelease is the load-bearing flag: it sets gpg.skip=false AND contributes the
      # maven-gpg-plugin execution. Without it the deploy silently produces unsigned artifacts,
      # which Central rejects — or worse, accepts into a draft that then sits unnoticed.
      - name: Deploy (dry run)
        if: steps.creds.outputs.mode == 'central' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          ./mvnw ${MAVEN_ARGS} -Prelease verify \
            -Dgpg.keyname="${{ steps.gpg.outputs.key_id }}"

      - name: Deploy to Maven Central
        if: steps.creds.outputs.mode == 'central' && (github.event_name == 'push' || !inputs.dry_run)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          ./mvnw ${MAVEN_ARGS} -Prelease deploy \
            -Dgpg.keyname="${{ steps.gpg.outputs.key_id }}"

      # Catches the unsigned-artifact failure mode directly rather than trusting the flags.
      - name: Assert every artifact is signed
        if: steps.creds.outputs.mode == 'central'
        shell: bash
        run: |
          shopt -s nullglob
          missing=0
          for f in target/*.jar target/*.pom; do
            if [[ ! -f "${f}.asc" ]]; then
              echo "::error::Missing signature for ${f}"
              missing=1
            fi
          done
          if [[ "${missing}" -eq 1 ]]; then exit 1; fi
          echo "All artifacts carry .asc signatures."

      # ALWAYS upload, tag or not.
      #
      # The first execution of this workflow finished green having produced nothing anyone could
      # install: artifacts were built and checksummed, then the only publishing step was skipped
      # because it is tag-gated and the run was a workflow_dispatch. A release job that reports
      # success and emits no consumable output is the same failure this project has now hit a
      # dozen times — a control that looks like it worked.
      #
      # A workflow_dispatch run is exactly how someone gets a build of an unreleased branch, so it
      # must yield a downloadable artifact. Tagged runs additionally create a GitHub Release.
      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: nexus-piercer-artifacts
          path: |
            target/*.jar
            target/*.pom
            target/*.sha256
            target/bom.json
            target/bom.xml
          retention-days: 90
          if-no-files-found: error

      - name: Verify something installable was actually produced
        shell: bash
        run: |
          shopt -s nullglob
          jars=(target/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "::error::No jars were produced. A release run must never report success with no artifact."
            exit 1
          fi
          {
            echo "### Artifacts"
            echo
            echo "| file | size |"
            echo "|---|---:|"
            for f in "${jars[@]}"; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "Install instructions: [docs/INSTALL.md](../blob/main/docs/INSTALL.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: docs/INSTALL.md
          files: |
            target/*.jar
            target/*.jar.asc
            target/*.pom
            target/*.pom.asc
            target/*.sha256
            target/bom.json
            target/bom.xml
