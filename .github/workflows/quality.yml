# Static analysis and supply-chain gates.
#
# Split from ci.yml on purpose. Checkstyle, PMD and SpotBugs have never executed against this
# codebase — the audit proved it by observing that all three plugins were absent from the local
# ~/.m2 entirely, i.e. never once downloaded. Turning them on for the first time against ~19,860
# lines produces a large violation count in one go.
#
# So the gates start in REPORT mode (continue-on-error) and flip to BLOCKING once the recorded
# debt baseline is in place. That is Phase 2 of docs/audit/ROADMAP.md. The transition is a
# one-line change per job, marked below.
#
# Reporting-but-not-blocking is a deliberate, time-boxed state — not the end state. A gate that
# never fails is the exact failure mode this repository already had.

name: Quality

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'perf/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

env:
  MAVEN_ARGS: -B -ntp -Dstyle.color=always

jobs:
  static-analysis:
    name: checkstyle / pmd / spotbugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # PHASE 2 FLIP: delete `continue-on-error` AND the three -Dfail* overrides below to make
      # analysis merge-blocking.
      #
      # The overrides matter for report mode specifically. SpotBugs runs first and, left to its
      # own devices, fails the build on the first violation — which meant the initial run reported
      # "242 bugs" and Checkstyle and PMD never executed at all. A report phase that only reports
      # one of three tools cannot produce the debt baseline it exists to produce. Forcing all
      # three to complete gives the real numbers; continue-on-error then keeps the job green while
      # the debt is being worked down.
      - name: Run static analysis
        id: analysis
        continue-on-error: true
        run: |
          ./mvnw ${MAVEN_ARGS} -Pquality verify -DskipTests \
            -Dspotbugs.failOnError=false \
            -Dpmd.failOnViolation=false \
            -Dcheckstyle.failOnViolation=false

      - name: Summarise violations
        if: always()
        shell: bash
        run: |
          {
            echo "### Static analysis"
            echo
            echo "| tool | violations |"
            echo "|---|---:|"

            cs=$( [[ -f target/checkstyle-result.xml ]] && grep -c '<error ' target/checkstyle-result.xml || echo 'n/a' )
            pmd=$( [[ -f target/pmd.xml ]] && grep -c '<violation ' target/pmd.xml || echo 'n/a' )
            sb=$( [[ -f target/spotbugsXml.xml ]] && grep -c '<BugInstance ' target/spotbugsXml.xml || echo 'n/a' )

            echo "| Checkstyle | ${cs} |"
            echo "| PMD | ${pmd} |"
            echo "| SpotBugs | ${sb} |"
            echo
            if [[ "${{ steps.analysis.outcome }}" == "failure" ]]; then
              echo "> Analysis reported problems. These are **not yet merge-blocking** — see Phase 2 in \`docs/audit/ROADMAP.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
            target/site/
          retention-days: 14
          if-no-files-found: warn

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Blocks a PR that introduces a dependency with a known high-severity advisory.
      # This one IS blocking from day one: it only ever evaluates dependencies the PR adds,
      # so it cannot fail on pre-existing debt and needs no baseline.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  cve-scan:
    name: CVE scan (OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The NVD API is rate-limited without a key and the cache is large; restoring it keeps
      # this job to a couple of minutes instead of ~20.
      - name: Restore NVD cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # PHASE 2 FLIP: remove continue-on-error once the two known CVEs are cleared
      # (poi-ooxml 5.2.5 / CVE-2025-31672 at compile scope, logback 1.4.14 /
      # CVE-2024-12798 and CVE-2024-12801 at test scope).
      - name: Scan dependencies
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw ${MAVEN_ARGS} -Psecurity org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7

      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30
          if-no-files-found: warn

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Generate CycloneDX SBOM
        run: ./mvnw ${MAVEN_ARGS} -Psecurity cyclonedx:makeAggregateBom -DskipTests -Dcyclonedx.skipNotDeployed=false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.*
          retention-days: 90
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Autobuild would run the full lifecycle including tests. Compile only.
      - name: Compile for analysis
        run: ./mvnw ${MAVEN_ARGS} clean compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
