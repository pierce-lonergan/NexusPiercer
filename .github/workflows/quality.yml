# Static analysis and supply-chain gates.
#
# Split from ci.yml on purpose. Checkstyle, PMD and SpotBugs have never executed against this
# codebase — the audit proved it by observing that all three plugins were absent from the local
# ~/.m2 entirely, i.e. never once downloaded. Turning them on for the first time against ~19,860
# lines produces a large violation count in one go.
#
# So the gates start in REPORT mode (continue-on-error) and flip to BLOCKING once the recorded
# debt baseline is in place. That is Phase 2 of docs/audit/ROADMAP.md. The transition is a
# one-line change per job, marked below.
#
# Reporting-but-not-blocking is a deliberate, time-boxed state — not the end state. A gate that
# never fails is the exact failure mode this repository already had.

name: Quality

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'perf/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

env:
  MAVEN_ARGS: -B -ntp -Dstyle.color=always

jobs:
  static-analysis:
    name: checkstyle / pmd / spotbugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Analysis runs to completion so all three tools report. The per-tool fail switches are off
      # HERE only; the gate is enforced by the ratchet step below, against recorded ceilings.
      #
      # Why not just let the plugins fail the build? Because SpotBugs runs first and would abort
      # before Checkstyle and PMD executed at all — the first run reported "242 bugs" and silently
      # analysed nothing else. And because 700 pre-existing violations cannot be fixed in one
      # change, so a zero-tolerance gate would simply be switched back off, which is precisely how
      # this project ended up with three analysers that had never run.
      #
      # -Djacoco.skip=true because this job runs -DskipTests; without it jacoco:check fails the
      # build on 0% coverage, which says nothing about code quality.
      - name: Run static analysis
        run: |
          ./mvnw ${MAVEN_ARGS} -Pquality verify -DskipTests -Djacoco.skip=true \
            -Dspotbugs.fail=false \
            -Dcheckstyle.fail=false \
            -Dpmd.violation.buildFailOnViolation=false

      # THE GATE. Blocking from this commit onward.
      #
      # Counts may not exceed the ceilings in .github/quality-baseline.json. Checkstyle is
      # zero-tolerance (its 9 violations were unused imports and are fixed); PMD and SpotBugs are
      # ratchets that can only be lowered. New debt is blocked immediately; existing debt is
      # visible and shrinking.
      - name: Enforce violation ratchet
        shell: bash
        run: |
          count() { [[ -f "$1" ]] && grep -o "$2" "$1" | wc -l || echo 0; }

          cs=$(count target/checkstyle-result.xml '<error ')
          pmd=$(count target/pmd.xml '<violation ')
          sb=$(count target/spotbugsXml.xml '<BugInstance ')

          read -r cs_max pmd_max sb_max < <(
            python3 -c "import json;d=json.load(open('.github/quality-baseline.json'));print(d['checkstyle']['ceiling'],d['pmd']['ceiling'],d['spotbugs']['ceiling'])"
          )

          status=0
          {
            echo "### Static analysis"
            echo
            echo "| tool | violations | ceiling | |"
            echo "|---|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          check() {
            local name=$1 actual=$2 max=$3 mark
            if (( actual > max )); then
              mark="❌ over by $(( actual - max ))"
              echo "::error::${name} rose from ${max} to ${actual}. Fix the new violations, or justify raising the ceiling in .github/quality-baseline.json."
              status=1
            elif (( actual < max )); then
              mark="✅ improved by $(( max - actual ))"
              echo "::notice::${name} fell from ${max} to ${actual}. Lower the ceiling in .github/quality-baseline.json to lock it in."
            else
              mark="✅"
            fi
            echo "| ${name} | ${actual} | ${max} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
          }

          check Checkstyle "$cs"  "$cs_max"
          check PMD        "$pmd" "$pmd_max"
          check SpotBugs   "$sb"  "$sb_max"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ceilings may only decrease — see \`.github/quality-baseline.json\`." >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
            target/site/
          retention-days: 14
          if-no-files-found: warn

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Blocks a PR that introduces a dependency with a known high-severity advisory.
      # This one IS blocking from day one: it only ever evaluates dependencies the PR adds,
      # so it cannot fail on pre-existing debt and needs no baseline.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  cve-scan:
    name: CVE scan (OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The NVD API is rate-limited without a key and the cache is large; restoring it keeps
      # this job to a couple of minutes instead of ~20.
      - name: Restore NVD cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # PHASE 2 FLIP: remove continue-on-error once the two known CVEs are cleared
      # (poi-ooxml 5.2.5 / CVE-2025-31672 at compile scope, logback 1.4.14 /
      # CVE-2024-12798 and CVE-2024-12801 at test scope).
      - name: Scan dependencies
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw ${MAVEN_ARGS} -Psecurity org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7

      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30
          if-no-files-found: warn

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Generate CycloneDX SBOM
        run: ./mvnw ${MAVEN_ARGS} -Psecurity cyclonedx:makeAggregateBom -DskipTests -Dcyclonedx.skipNotDeployed=false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.*
          retention-days: 90
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Autobuild would run the full lifecycle including tests. Compile only.
      - name: Compile for analysis
        run: ./mvnw ${MAVEN_ARGS} clean compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
