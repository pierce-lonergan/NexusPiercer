name: Feature request
description: Suggest a capability
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What would the call look like?
      render: java

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
